# Pre-commit hooks. Install once with:
#   pip install pre-commit && pre-commit install
# The gitleaks hook scans every commit for secrets/credentials before they
# can enter history — the last line of defence for a public repo.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=512"]
      # Refuse to commit Jupyter notebooks that still contain cell outputs.
      - id: check-ast

  - repo: https://github.com/kynan/nbstripout
    rev: 0.7.1
    hooks:
      - id: nbstripout
