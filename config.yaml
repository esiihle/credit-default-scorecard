# =============================================================================
# Credit Default Scorecard configuration — the single source of truth for a run.
# Nothing that changes behaviour is hard-coded in the source; it lives here so
# the same command always reproduces the same result.
# =============================================================================

project: credit-default-scorecard
seed: 42                       # fixes all randomness for reproducibility

data:
  sample_path: data/sample/german_credit_sample.csv   # bundled sample (committed)
  raw_dir: data/raw                                   # real inputs (git-ignored)
  processed_dir: data/processed                       # outputs (git-ignored)

  # --- Real data source (settled 30 Sep 2026) -------------------------------
  # UCI Statlog (German Credit), dataset 144. The file is space-delimited, has
  # NO header row, and codes every categorical value as A11, A34, ... — so the
  # column names and code table live in src/load.py and are applied on load.
  source: "UCI Statlog (German Credit Data), dataset id 144"
  source_page: "https://archive.ics.uci.edu/dataset/144/statlog+german+credit+data"
  raw_file: german.data
  download_url: "https://archive.ics.uci.edu/ml/machine-learning-databases/statlog/german/german.data"
  sample_rows: 24            # size of the committed sample built by scripts/make_sample.py

# Column contract for the German Credit dataset (readable-name version).
schema:
  target_column: target
  # Raw target codes: 1 = good, 2 = bad. Phase 1 recodes to 0 = good, 1 = default.
  bad_value_raw: 2             # "bad" = default = the event we model
  numeric_columns:
    - duration_months
    - credit_amount
    - installment_rate
    - residence_since
    - age_years
    - existing_credits
    - num_liable
  categorical_columns:
    - checking_status
    - credit_history
    - purpose
    - savings_status
    - employment_since
    - personal_status_sex
    - other_debtors
    - property
    - other_installment_plans
    - housing
    - job
    - telephone
    - foreign_worker

# --- Phase 1: data validation rules ------------------------------------------
# Plausibility limits for this portfolio. Every threshold is configuration so it
# can be read and challenged without opening a .py file.
validation:
  min_age: 18                  # below the age of majority = a data error
  max_age: 100
  min_duration_months: 1
  max_duration_months: 120     # 10 years is already long for this book
  min_credit_amount: 1
  max_credit_amount: 100000
  drop_duplicate_rows: true
  max_dropped_fraction: 0.05   # if we'd drop more than 5%, stop and shout

# Train/test split (Phase 1).
split:
  test_size: 0.30
  stratify: true               # keep the same bad rate in both halves
  # Out-of-time slice: NOT possible with this dataset — German Credit carries no
  # application or performance date. Stability is therefore tested in Phase 5 with
  # PSI across the random split, and the limitation is stated in the methodology
  # rather than hidden.
  out_of_time: false
  train_filename: train.csv
  test_filename: test.csv
  manifest_filename: split_manifest.json

# Binning / coarse classing (Phase 2).
binning:
  max_bins: 5
  min_bin_fraction: 0.05        # each bin must hold at least 5% of accounts
  enforce_monotonic: true

# WOE / IV selection (Phase 3).
woe:
  iv_min: 0.02                  # drop features weaker than this
  iv_leakage_flag: 0.50         # investigate features stronger than this for leakage

# Score scaling (Phase 6) — standard PDO / factor / offset.
scaling:
  pdo: 20                       # points to double the good:bad odds
  base_score: 600              # score at the reference odds
  base_odds: 50                # good:bad odds at the base score

logging:
  level: INFO
