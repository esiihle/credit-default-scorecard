[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "compact2binary"
version = "0.2.0"
description = "Convert compact multi-response survey data into a binary (0/1) indicator matrix."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["survey", "market-research", "data-processing", "multi-response", "recoding"]
dependencies = [
    "pandas>=2.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
synthetic = ["Faker>=24.0"]
parquet = ["pyarrow>=15.0"]
dev = ["pytest>=8.0", "Faker>=24.0", "pyarrow>=15.0"]

[project.scripts]
compact2binary = "compact2binary.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
